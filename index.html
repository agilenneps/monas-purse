<html lang="en">
<head>

<title>Mona's Purse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF3F6;--card:#fff;--ink:#2E1A2B;--muted:#8F7589;--line:#F2DFE7;--chip:#FBE9F0;--accent:#D6457E;--good:#2FB36E;--warn:#EE9B22;--bad:#E8473F}
@media (prefers-color-scheme:dark){:root{--bg:#1A1018;--card:#251822;--ink:#F9EAF2;--muted:#B79CB0;--line:#3B2836;--chip:#311F2C}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input::placeholder{color:var(--muted);opacity:.6}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;background:var(--bg)}
.mtitle{flex:1;min-width:0;line-height:1.15}
.mtitle small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtitle span{display:block;font-family:'Poppins',sans-serif;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1;flex:none}
.mpill{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.mpill button{width:38px;height:38px;font-size:20px;line-height:1}
.mpill button+button{border-left:1px solid var(--line)}
#view.enter{animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;display:block}
h3{font-size:15px;font-weight:700;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.head h3{margin:0}
.hello{font-family:'Poppins',sans-serif;font-size:26px;font-weight:600;margin:2px 2px 14px}.hello span{display:block;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.hero{display:flex;gap:18px;align-items:center;background:radial-gradient(120% 140% at 100% 0%,var(--chip),var(--card) 60%)}
.ringbox{position:relative;width:112px;flex:none}
.ring{width:112px;height:112px;display:block}
.track{fill:none;stroke:var(--line);stroke-width:12}
.fill{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .6s}
.fill.good{stroke:var(--good)}.fill.warn{stroke:var(--warn)}.fill.bad{stroke:var(--bad)}
.ring-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-txt b{font-family:'Poppins',sans-serif;font-size:24px}.ring-txt span{font-size:11px;color:var(--muted)}
.label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.big{font-family:'Poppins',sans-serif;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:3px 0;word-break:break-word}
.sub{font-size:13px;color:var(--muted)}
.pill{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);font-weight:700;font-size:13px}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tiny{font-size:12px;color:var(--muted);margin-top:3px}
.bad-t{color:var(--bad)}
.muted{color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;min-width:0}
.tile .v{font-weight:700;font-size:17px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list>.row:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.emo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.grow>div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtop{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.amt{font-weight:700;white-space:nowrap}.amt small{color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bar .good{background:var(--good)}.bar .warn{background:var(--warn)}.bar .bad{background:var(--bad)}
.link{color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.chev{color:var(--muted);font-size:20px}
.cardlink{display:flex;align-items:center;gap:12px;font-weight:700}
.trend{display:flex;gap:8px;height:150px}
.tbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.tcol{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.tcol i{width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--line);transition:height .5s}
.tbar.on i{background:var(--accent)}.tbar.on{color:var(--ink);font-weight:700}
.minitrend{display:flex;gap:6px;height:48px;align-items:flex-end;margin-top:10px}
.minitrend i{flex:1;border-radius:6px 6px 2px 2px;background:var(--line);min-height:4px}
.minitrend i.on{background:var(--accent)}
.donutwrap{display:flex;gap:18px;align-items:center}
.donut{width:136px;height:136px;flex:none}
.donut circle{fill:none;stroke-width:16}
.legend{flex:1;min-width:0;display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.legend b{margin-left:auto;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sumcard{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.sumcard .big{font-size:24px;margin:0}
.dayhead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:4px 4px 8px}
.daycard{padding:4px 16px}
.brow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.brow input{width:112px;text-align:right;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:var(--chip);font-weight:700}
.cur{color:var(--muted)}
.btotal{display:flex;justify-content:space-between;padding:14px 0 2px;border-top:2px dashed var(--line);margin-top:6px;font-weight:600}
.btns{display:flex;gap:10px;margin-top:16px}.btns>*{flex:1}
.primary{background:var(--accent);color:#fff;padding:14px;border-radius:16px;font-weight:700;text-align:center}
.ghost{background:var(--chip);padding:14px;border-radius:16px;font-weight:700;text-align:center}
.danger{color:var(--bad)}
.amtbox{display:flex;align-items:baseline;justify-content:center;gap:4px;font-family:'Poppins',sans-serif;font-size:48px;margin:10px 0 6px}
.amtbox span{color:var(--muted)}
.amtbox input{width:1.5ch;min-width:1.5ch;max-width:9ch;border:0;background:none;font-family:inherit;font-size:inherit;font-weight:600;outline:none}
.flabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 8px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--chip);border:2px solid transparent;font-weight:600;font-size:13px}
.pk span{font-size:22px}
.pk.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.field{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.emoji-in{text-align:center;font-size:22px;flex:0 0 72px!important}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:36px;height:36px;border-radius:50%}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 4px;font-weight:700}
.preview .emo{width:76px;height:76px;font-size:36px;border-radius:26px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 18px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--accent) center/cover;color:#fff;font-weight:700;font-size:28px;display:grid;place-items:center;margin-bottom:10px}
.signout{width:100%;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--bad);font-weight:700}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;padding:6px;background:var(--ink);border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:6}
.nav a{color:var(--bg);opacity:.55;padding:7px 11px;border-radius:18px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.nav a.on{opacity:1;background:color-mix(in srgb,var(--bg) 14%,transparent)}
.nav .add{background:var(--accent);opacity:1;color:#fff;font-size:28px;font-weight:500;width:52px;height:46px;justify-content:center;margin:0 3px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}.empty div{font-size:34px;margin-bottom:8px}
#auth{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(140deg,#F28AB2,var(--accent) 55%,#8E2F6B);display:grid;place-items:center;font-size:42px;margin:0 auto 18px;transform:rotate(-6deg);box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
#auth h1{font-family:'Poppins',sans-serif;font-size:42px}
#auth p{color:var(--muted);margin:6px 0 28px}
.gbtn{width:100%;max-width:300px;padding:15px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700}
.note{font-size:12px;color:var(--muted);max-width:300px;margin:16px auto 0}
.amtcard,.incard{text-align:center;cursor:text}
.amtbox.sm{font-size:36px;margin:6px 0 2px}
.allocbar{display:flex;height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.allocbar i{display:block;height:100%}
.allocsum{font-size:13px;margin-bottom:6px}
.pct{display:block;font-size:12px;color:var(--muted);font-weight:500}
.good-t{color:var(--good)}
.btotal.save{border-top:0;padding-top:6px;margin-top:0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 4px}.trio b{font-size:16px;display:block;margin-top:2px}
</style>
</head>
<body>

<div id="auth" hidden>
  <div>
    <div class="logo">🪷</div>
    <h1>Mona's Purse</h1>
    <p>Every rupee, beautifully kept.</p>
    <button class="gbtn" id="signin">Continue with Google</button>
    <div class="note" id="authNote">Your data syncs to your account, so it's there on any phone you sign in from.</div>
  </div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header class="top" id="head"></header>
    <main id="view"><div class="empty">Loading…</div></main>
  </div>
  <nav class="nav" id="nav">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/history" data-nav="history"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</a>
    <a href="#/add" class="add" aria-label="Add expense">+</a>
    <a href="#/budgets" data-nav="budgets"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Budgets</a>
    <a href="#/me" data-nav="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</a>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* Firebase config (public client identifiers; data is protected by Firestore security rules) */
const firebaseConfig = {
  apiKey: "AIzaSyAfrJAmUcehhjqgVUUaRneew0Zhj5-v3_g",
  authDomain: "priyas-purse.firebaseapp.com",
  projectId: "priyas-purse",
  storageBucket: "priyas-purse.firebasestorage.app",
  messagingSenderId: "351552790980",
  appId: "1:351552790980:web:d05e313c65893b57310491"
};

const LOCAL = !firebaseConfig.projectId;
const G = 'https://www.gstatic.com/firebasejs/10.12.2';
let F = null, auth = null, db = null;
if (!LOCAL) {
  const [A, Au, Fs] = await Promise.all([import(`${G}/firebase-app.js`), import(`${G}/firebase-auth.js`), import(`${G}/firebase-firestore.js`)]);
  F = { ...Au, ...Fs };
  const app = A.initializeApp(firebaseConfig);
  auth = Au.getAuth(app);
  db = Fs.initializeFirestore(app, { localCache: Fs.persistentLocalCache({ tabManager: Fs.persistentMultipleTabManager() }) });
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = () => { const d = new Date(); return `${ym(d)}-${pad(d.getDate())}`; };
const addMonths = (m, k) => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + k, 1)); };
const daysIn = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const monthLabel = (m, short) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', short ? { month: 'short' } : { month: 'long', year: 'numeric' }); };
const fmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 2 });
const money = n => fmt.format(Math.round(n * 100) / 100);
const short = n => n >= 1e5 ? '₹' + (n / 1e5).toFixed(1) + 'L' : n >= 1000 ? '₹' + (n / 1000).toFixed(1) + 'k' : '₹' + Math.round(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
let toastT;
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };
const run = p => Promise.resolve(p).catch(e => toast('Could not save: ' + e.message));

const PALETTE = ['#FF8A5B', '#5BA8C8', '#B57BEA', '#F2B134', '#5CC98A', '#FF5D8F', '#6C8CFF', '#A0785A', '#2EC4B6', '#9A9087'];
const DEFAULT_CATS = [
  { id: 'food', name: 'Food', emoji: '🍜', color: '#FF8A5B' },
  { id: 'travel', name: 'Travel', emoji: '🛺', color: '#5BA8C8' },
  { id: 'shopping', name: 'Shopping', emoji: '🛍️', color: '#B57BEA' },
  { id: 'bills', name: 'Bills', emoji: '💡', color: '#F2B134' },
  { id: 'health', name: 'Health', emoji: '💊', color: '#5CC98A' },
  { id: 'fun', name: 'Fun', emoji: '🎬', color: '#FF5D8F' }
];

const state = { month: ym(new Date()), filter: null, lastCat: null, categories: [], budgets: {}, income: {}, expenses: [], ready: false, user: null };
const cat = id => state.categories.find(c => c.id === id) || { id, name: 'Uncategorised', emoji: '🏷️', color: '#9A9087' };
const monthExp = m => state.expenses.filter(e => e.month === m);
const sum = a => a.reduce((s, e) => s + e.amount, 0);
const tone = p => p > 1 ? 'bad' : p > .8 ? 'warn' : 'good';
function stats(m) {
  const ex = monthExp(m), bud = state.budgets[m] || {}, spent = {};
  ex.forEach(e => spent[e.catId] = (spent[e.catId] || 0) + e.amount);
  const total = sum(ex), budget = state.categories.reduce((s, c) => s + (+bud[c.id] || 0), 0);
  return { ex, bud, spent, total, budget, income: state.income[m] || 0, left: budget - total, pct: budget ? total / budget : 0 };
}

/* ---------- data stores ---------- */
function cloudStore(userId) {
  const { doc, collection, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, query, where, getDocs } = F;
  const userRef = doc(db, 'users', userId);
  const expCol = collection(db, 'users', userId, 'expenses');
  const budCol = collection(db, 'users', userId, 'budgets');
  let subs = [], expSub = null;
  return {
    start() {
      subs.push(onSnapshot(userRef, { includeMetadataChanges: true }, s => {
        if (!s.exists()) { if (!s.metadata.fromCache) setDoc(userRef, { categories: DEFAULT_CATS }, { merge: true }); return; }
        const nc = s.data().categories || [], same = state.ready && JSON.stringify(nc) === JSON.stringify(state.categories);
        state.categories = nc; state.ready = true; if (!same) render(true);
      }));
      subs.push(onSnapshot(budCol, s => { const b = {}, inc = {}; s.forEach(d => { b[d.id] = d.data().amounts || {}; inc[d.id] = d.data().income || 0; }); state.budgets = b; state.income = inc; render(true); }));
      this.watch();
    },
    watch() {
      expSub && expSub();
      expSub = onSnapshot(query(expCol, where('month', '>=', addMonths(state.month, -5)), where('month', '<=', state.month)),
        s => { state.expenses = s.docs.map(d => ({ id: d.id, ...d.data() })); render(true); });
    },
    saveCategories: c => setDoc(userRef, { categories: c }, { merge: true }),
    saveBudget: (m, a, inc) => setDoc(doc(budCol, m), { amounts: a, income: inc || 0 }),
    addExpense: e => addDoc(expCol, { ...e, createdAt: Date.now() }),
    updateExpense: (id, e) => updateDoc(doc(expCol, id), e),
    deleteExpense: id => deleteDoc(doc(expCol, id)),
    allExpenses: async () => (await getDocs(expCol)).docs.map(d => d.data()),
    stop() { subs.forEach(u => u()); subs = []; expSub && expSub(); expSub = null; }
  };
}

function localStore() {
  const K = 'monas-purse-local-v1';
  let d = null; try { d = JSON.parse(localStorage.getItem(K)); } catch {}
  d = d || { categories: DEFAULT_CATS, budgets: {}, expenses: [] }; d.income = d.income || {};
  const pull = () => { state.categories = d.categories; state.budgets = d.budgets; state.income = d.income; state.expenses = d.expenses; state.ready = true; render(true); };
  const save = () => { try { localStorage.setItem(K, JSON.stringify(d)); } catch {} pull(); };
  return {
    start: pull, watch: pull, stop() {},
    saveCategories: c => { d.categories = c; save(); },
    saveBudget: (m, a, inc) => { d.budgets[m] = a; d.income[m] = inc || 0; save(); },
    addExpense: e => { d.expenses.push({ ...e, id: uid(), createdAt: Date.now() }); save(); },
    updateExpense: (id, e) => { Object.assign(d.expenses.find(x => x.id === id), e); save(); },
    deleteExpense: id => { d.expenses = d.expenses.filter(x => x.id !== id); save(); },
    allExpenses: async () => d.expenses
  };
}

/* ---------- shared bits ---------- */
const emo = c => `<div class="emo" style="background:${c.color}26">${c.emoji}</div>`;
const empty = (icon, title, sub) => `<div class="empty"><div>${icon}</div><b>${title}</b>${sub}</div>`;
const expRow = e => { const c = cat(e.catId); return `<a class="row" href="#/edit/${esc(e.id)}">${emo(c)}<div class="grow"><div style="font-weight:600">${esc(e.note || c.name)}</div><div class="tiny">${esc(c.name)} · ${new Date(e.date + 'T00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}</div></div><div class="amt">${money(e.amount)}</div></a>`; };
const sortExp = a => a.slice().sort((x, y) => y.date.localeCompare(x.date) || (y.createdAt || 0) - (x.createdAt || 0));
function ring(pct, has) {
  const R = 50, C = 2 * Math.PI * R;
  return `<div class="ringbox"><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="${R}" class="track"/>
    <circle cx="60" cy="60" r="${R}" class="fill ${tone(pct)}" stroke-dasharray="${Math.min(pct, 1) * C} ${C}" transform="rotate(-90 60 60)"/></svg>
    <div class="ring-txt"><b>${has ? Math.round(pct * 100) + '%' : '–'}</b><span>used</span></div></div>`;
}
function catRow(id, s) {
  const c = cat(id), sp = s.spent[id] || 0, b = +s.bud[id] || 0, p = b ? sp / b : (sp ? 1 : 0), t = b ? tone(p) : '';
  return `<a class="row" href="#/cat/${esc(id)}">${emo(c)}<div class="grow">
    <div class="rtop"><span>${esc(c.name)}</span><span class="amt ${!b && !sp ? 'muted' : ''}">${money(sp)}${b ? `<small> / ${money(b)}</small>` : ''}</span></div>
    ${!b && !sp ? '<div class="tiny">No budget set</div>' : `<div class="bar"><i class="${t}" style="width:${Math.min(p, 1) * 100}%;${t ? '' : `background:${c.color}`}"></i></div>`}
    ${b && p > 1 ? `<div class="tiny bad-t">${money(sp - b)} over budget</div>` : ''}</div></a>`;
}
const last6 = m => [...Array(6)].map((_, i) => addMonths(m, i - 5));

/* ---------- pages ---------- */
function pageHome() {
  const m = state.month, s = stats(m), now = new Date(), cur = ym(now) === m;
  const daysLeft = cur ? daysIn(m) - now.getDate() + 1 : 0, elapsed = cur ? now.getDate() : daysIn(m);
  const hr = now.getHours(), part = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const hello = cur ? `<div class="hello">${part}, Mona 🌸<span>${s.left < 0 && s.budget ? "A little over this month, that's okay." : s.budget ? "You're doing lovely this month." : "Let's plan this month together."}</span></div>` : '';
  const hero = `<section class="card hero">${ring(s.pct, s.budget)}
    <div class="grow">
      <div class="label">Spent in ${monthLabel(m, true)}</div>
      <div class="big">${money(s.total)}</div>
      <div class="sub">${s.budget ? `of ${money(s.budget)} budget` : 'No budget set yet'}</div>
      ${s.budget ? `<div class="pill ${s.left < 0 ? 'bad' : ''}">${s.left < 0 ? money(-s.left) + ' over' : money(s.left) + ' left'}</div>`
                 : `<a class="link" href="#/budgets">Set budgets →</a>`}
      ${cur && s.budget && s.left > 0 ? `<div class="tiny">≈ ${money(Math.floor(s.left / daysLeft))}/day for ${daysLeft} day${daysLeft > 1 ? 's' : ''}</div>` : ''}
    </div></section>`;
  const over = s.income - s.total < 0;
  const incCard = s.income ? `<section class="card"><div class="head"><h3>Income this month</h3><a class="link" href="#/budgets">Plan →</a></div>
    <div class="trio"><div><div class="label">Income</div><b>${money(s.income)}</b></div><div><div class="label">Spent</div><b>${money(s.total)}</b></div><div><div class="label">${over ? 'Over' : 'Left'}</div><b class="${over ? 'bad-t' : 'good-t'}">${money(Math.abs(s.income - s.total))}</b></div></div>
    <div class="bar"><i class="${tone(s.total / s.income)}" style="width:${Math.min(1, s.total / s.income) * 100}%"></i></div>
    <div class="tiny">${s.budget ? `Budgeted ${money(s.budget)} · planned savings ${money(Math.max(0, s.income - s.budget))}` : 'Split your income into category budgets on the Budgets page.'}</div></section>`
    : cur ? `<a class="card cardlink" href="#/budgets"><span class="emo" style="background:var(--chip)">💰</span><span class="grow">Add this month's income<div class="tiny">Then split it into category budgets</div></span><span class="chev">›</span></a>` : '';
  const topId = Object.keys(s.spent).sort((a, b) => s.spent[b] - s.spent[a])[0];
  const tiles = `<div class="tiles">
    <a class="tile" href="${topId ? '#/cat/' + esc(topId) : '#/add'}"><div class="label">Top spend</div><div class="v">${topId ? `${cat(topId).emoji} ${esc(cat(topId).name)}` : '—'}</div><div class="tiny">${topId ? money(s.spent[topId]) : 'Nothing yet'}</div></a>
    <a class="tile" href="#/insights"><div class="label">Daily average</div><div class="v">${money(Math.round(s.total / elapsed))}</div><div class="tiny">${s.ex.length} expense${s.ex.length === 1 ? '' : 's'}</div></a></div>`;
  const ids = state.categories.map(c => c.id).filter(id => s.spent[id] || +s.bud[id]).sort((a, b) => (s.spent[b] || 0) - (s.spent[a] || 0)).slice(0, 4);
  const glance = `<section class="card"><div class="head"><h3>Budgets at a glance</h3><a class="link" href="#/insights">All →</a></div>
    <div class="list">${ids.length ? ids.map(id => catRow(id, s)).join('') : empty('🎯', 'No budgets yet', 'Set a budget to track each category.')}</div></section>`;
  const recent = sortExp(s.ex).slice(0, 3);
  const recentCard = recent.length
    ? `<section class="card"><div class="head"><h3>Recent</h3><a class="link" href="#/history">See all →</a></div><div class="list">${recent.map(expRow).join('')}</div></section>`
    : `<section class="card">${empty('✍️', 'Nothing spent yet', 'Tap + to log your first expense.')}</section>`;
  const months = last6(m), totals = months.map(mm => sum(monthExp(mm))), mx = Math.max(...totals, 1);
  const teaser = `<a class="card" href="#/insights"><div class="cardlink"><span class="grow">📈 Insights</span><span class="chev">›</span></div>
    <div class="minitrend">${totals.map((t, i) => `<i class="${months[i] === m ? 'on' : ''}" style="height:${Math.max(8, t / mx * 100)}%"></i>`).join('')}</div>
    <div class="tiny">Spending trend and category breakdown</div></a>`;
  return hello + hero + incCard + tiles + glance + recentCard + teaser;
}

function pageInsights() {
  const m = state.month, s = stats(m);
  const ids = Object.keys(s.spent).sort((a, b) => s.spent[b] - s.spent[a]);
  const R = 52, C = 2 * Math.PI * R; let acc = 0;
  const segs = ids.map(id => { const f = s.spent[id] / s.total, seg = `<circle cx="70" cy="70" r="${R}" stroke="${cat(id).color}" stroke-dasharray="${Math.max(0, f * C - 2)} ${C}" stroke-dashoffset="${-acc * C}" transform="rotate(-90 70 70)"/>`; acc += f; return seg; }).join('');
  const donut = s.total ? `<section class="card"><h3>Where it went</h3><div class="donutwrap">
    <svg class="donut" viewBox="0 0 140 140"><circle cx="70" cy="70" r="${R}" stroke="var(--line)"/>${segs}
      <text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--muted)">Total</text>
      <text x="70" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${short(s.total)}</text></svg>
    <div class="legend">${ids.slice(0, 6).map(id => `<div><i class="dot" style="background:${cat(id).color}"></i><span>${esc(cat(id).name)}</span><b>${Math.round(s.spent[id] / s.total * 100)}%</b></div>`).join('')}</div></div></section>`
    : `<section class="card">${empty('🌱', 'No spending this month', 'Insights appear once you add expenses.')}</section>`;
  const biggest = s.ex.slice().sort((a, b) => b.amount - a.amount)[0];
  const tiles = `<div class="tiles">
    <div class="tile"><div class="label">Biggest</div><div class="v">${biggest ? money(biggest.amount) : '—'}</div><div class="tiny">${biggest ? esc(biggest.note || cat(biggest.catId).name) : 'Nothing yet'}</div></div>
    <div class="tile"><div class="label">Per expense</div><div class="v">${s.ex.length ? money(Math.round(s.total / s.ex.length)) : '—'}</div><div class="tiny">${s.ex.length} this month</div></div></div>`;
  const all = [...state.categories.map(c => c.id), ...Object.keys(s.spent).filter(id => !state.categories.some(c => c.id === id))];
  const cats = `<section class="card"><h3>Categories vs budget</h3><div class="list">${all.map(id => catRow(id, s)).join('')}</div></section>`;
  const months = last6(m), totals = months.map(mm => sum(monthExp(mm))), mx = Math.max(...totals, 1);
  const trend = `<section class="card"><h3>Last 6 months</h3><div class="trend">${months.map((mm, i) =>
    `<button class="tbar ${mm === m ? 'on' : ''}" data-act="month" data-m="${mm}"><span>${totals[i] ? short(totals[i]) : ''}</span><div class="tcol"><i style="height:${Math.max(4, totals[i] / mx * 100)}%"></i></div><span>${monthLabel(mm, true)}</span></button>`).join('')}</div></section>`;
  return donut + tiles + cats + trend;
}

    <div class="sub">${b ? `of ${money(b)} budget` : 'No budget for this category'}</div>

function pageHistory() {
  let ex = monthExp(state.month);
  if (state.filter) ex = ex.filter(e => e.catId === state.filter);
  const chips = `<div class="chips"><button class="chip ${!state.filter ? 'on' : ''}" data-act="filter" data-cat="">All</button>${state.categories.map(c =>
    `<button class="chip ${state.filter === c.id ? 'on' : ''}" data-act="filter" data-cat="${esc(c.id)}">${c.emoji} ${esc(c.name)}</button>`).join('')}</div>`;
  if (!ex.length) return chips + `<section class="card">${empty('🧾', 'No expenses here', 'Tap + to add one.')}</section>`;
  const groups = {};
  sortExp(ex).forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  const t = today(), y = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return `${ym(d)}-${pad(d.getDate())}`; })();
  return chips + `<section class="card sumcard"><div><div class="label">${state.filter ? esc(cat(state.filter).name) : 'Total'} · ${monthLabel(state.month, true)}</div><div class="sub">${ex.length} expense${ex.length > 1 ? 's' : ''}</div></div><div class="big">${money(sum(ex))}</div></section>` +
    Object.entries(groups).map(([date, list]) => {
      const lbl = date === t ? 'Today' : date === y ? 'Yesterday' : new Date(date + 'T00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
      return `<div class="dayhead"><span>${lbl}</span><span>${money(sum(list))}</span></div><section class="card daycard"><div class="list">${list.map(expRow).join('')}</div></section>`;

function afterCatForm(r) {
  const f = $('#catForm'); if (!f) return;
  const c = r.id ? state.categories.find(x => x.id === r.id) : null;
  let color = f.dataset.color;
  const pv = () => { $('#pvEmo').textContent = f.emoji.value.trim() || '🏷️'; $('#pvEmo').style.background = color + '26'; $('#pvName').textContent = f.cname.value.trim() || 'New category'; };
  f.emoji.oninput = f.cname.oninput = pv;
  f.querySelectorAll('.sw').forEach(b => b.onclick = () => { color = b.dataset.c; f.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); pv(); });
  f.onsubmit = ev => {
    ev.preventDefault();
    const name = f.cname.value.trim();
    if (!name) return toast('Give it a name');
    const obj = { id: c?.id || uid(), name, emoji: f.emoji.value.trim() || '🏷️', color };

function pageAdd(r) {

  const sel = e?.catId || (state.categories.some(c => c.id === state.lastCat) ? state.lastCat : state.categories[0].id);
  const defDate = e?.date || (state.month === ym(new Date()) ? today() : `${state.month}-01`);
  return `<form id="expForm" data-sel="${esc(sel)}">
    <label class="card amtcard"><div class="label">Amount</div>

    <div class="flabel">Category</div>

    <div class="btns" style="margin-top:24px">${e ? `<button type="button" class="ghost danger" id="delExp">Delete</button>` : ''}<button class="primary" type="submit">${e ? 'Save changes' : 'Add expense'}</button></div>

function afterAdd(r) {
  const f = $('#expForm'); if (!f) return;
  const e = r.id ? state.expenses.find(x => x.id === r.id) : null;
  let sel = f.dataset.sel;
  f.querySelectorAll('.pk').forEach(b => b.onclick = () => { sel = b.dataset.id; f.querySelectorAll('.pk').forEach(x => x.classList.toggle('on', x === b)); });
  const fit = () => f.amount.style.width = (Math.max(1, f.amount.value.length) + 0.5) + 'ch';
  f.amount.oninput = fit; fit();
  if (!e) setTimeout(() => f.amount.focus(), 250);
  f.onsubmit = ev => {
    ev.preventDefault();
    const amount = Math.round(parseFloat(f.amount.value) * 100) / 100;
    if (!(amount > 0)) return toast('Enter an amount');
    const date = f.date.value || today();
    const data = { amount, catId: sel, date, month: date.slice(0, 7), note: f.note.value.trim() };
    run(e ? store.updateExpense(e.id, data) : store.addExpense(data));
    toast(e ? 'Updated' : `Added ${money(amount)} ✓`); back('');
  };
  if (e) $('#delExp').onclick = () => { if (confirm('Delete this expense?')) { run(store.deleteExpense(e.id)); toast('Deleted'); back('history'); } };

/* ---------- router ---------- */
const PAGES = {
  home: { nav: 'home', month: true, head: () => ["Mona's Purse", monthLabel(state.month)], render: pageHome },
  history: { nav: 'history', month: true, head: () => ['History', monthLabel(state.month)], render: pageHistory },
  budgets: { nav: 'budgets', month: true, form: true, head: () => ['Budgets', monthLabel(state.month)], render: pageBudgets, after: updateAlloc },
  me: { nav: 'me', head: () => ["Mona's Purse", 'Profile'], render: pageMe },
  insights: { back: '', month: true, head: () => ['Insights', monthLabel(state.month)], render: pageInsights },
  cat: { back: '', month: true, head: r => [`${cat(r.id).emoji} ${cat(r.id).name}`, monthLabel(state.month)], render: pageCat },
  categories: { back: 'me', head: () => ['Settings', 'Categories'], render: pageCategories },
  catform: { back: 'categories', form: true, noNav: true, head: r => ['Categories', r.id ? 'Edit category' : 'New category'], render: pageCatForm, after: afterCatForm },
  add: { back: '', form: true, noNav: true, head: r => ["Mona's Purse", r.id ? 'Edit expense' : 'New expense'], render: pageAdd, after: afterAdd }
};
function parseRoute() {
  const [a, b, c] = location.hash.replace(/^#\/?/, '').split('/');
  if (!a) return { name: 'home' };
  if (a === 'categories' && b === 'new') return { name: 'catform' };
  if (a === 'categories' && b === 'edit') return { name: 'catform', id: c };
  if (a === 'cat') return { name: 'cat', id: b };
  if (a === 'edit') return { name: 'add', id: b };
  return { name: PAGES[a] ? a : 'home' };
}
let lastKey = '', lastHtml = '', navs = 0;
function render(fromData) {
  if (!state.ready) return;
  const r = parseRoute(), P = PAGES[r.name], key = location.hash || '#/';
  if (fromData && P.form && key === lastKey) return; // don't wipe a form she's filling in
  const changed = key !== lastKey;
  const [small, big] = P.head(r);
  const headHtml = `${P.back !== undefined ? `<button class="ic" data-act="back" data-to="${P.back}" aria-label="Back">←</button>` : ''}
    <div class="mtitle"><small>${esc(small)}</small><span>${esc(big)}</span></div>
    ${P.month ? `<div class="mpill"><button data-act="prev" aria-label="Previous month">‹</button><button data-act="next" aria-label="Next month">›</button></div>` : ''}`;
  const html = P.render(r);
  if (fromData && !changed && headHtml + html === lastHtml) return; // nothing changed: leave the page alone so taps aren't lost
  lastKey = key; lastHtml = headHtml + html;
  $('#head').innerHTML = headHtml;
  $('#nav').hidden = !!P.noNav;
  document.querySelectorAll('#nav [data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === P.nav));
  const v = $('#view'); v.innerHTML = html;
  if (changed) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); scrollTo(0, 0); }
  P.after && P.after(r);
}
function back(to) { if (navs > 0) { navs -= 2; history.back(); } else location.replace('#/' + to); }
window.addEventListener('hashchange', () => { navs++; render(); });
window.addEventListener('installready', () => { if (location.hash === '#/me') { lastKey = ''; lastHtml = ''; render(); } });
window.addEventListener('appinstalled', () => { window.__installEvt = null; toast('Installed ✓'); });

/* ---------- events ---------- */
function setMonth(m) { state.month = m; store.watch(); lastKey = ''; lastHtml = ''; render(); }
function updateAlloc() {
  const f = $('#budgetForm'); if (!f) return;
  const incEl = f.elements['__income'], inc = parseFloat(incEl.value) || 0;
  incEl.style.width = (Math.max(1, incEl.value.length) + 0.5) + 'ch';
  let t = 0; const parts = [];
  state.categories.forEach(c => {
    const v = parseFloat(f.elements[c.id]?.value) || 0; t += v; parts.push([c, v]);
    const el = f.querySelector(`[data-pct="${CSS.escape(c.id)}"]`);
    if (el) el.textContent = inc && v ? `${Math.round(v / inc * 100)}% of income` : '';
  });
  const left = inc - t;
  $('#btotal').textContent = money(t);
  const bar = $('#allocBar'); bar.hidden = !inc;
  bar.innerHTML = parts.filter(p => p[1] > 0).map(([c, v]) => `<i style="width:${v / Math.max(inc, t) * 100}%;background:${c.color}"></i>`).join('');
  $('#allocSum').innerHTML = !inc ? '<span class="tiny">Add your income above to see how much is left to plan.</span>'
    : left >= 0 ? `<b>${money(t)}</b> planned of ${money(inc)} · <b class="good-t">${money(left)} left to plan</b>`
    : `<b class="bad-t">${money(-left)} more than your income</b>`;
  $('#saveRow').innerHTML = inc ? `<span>🌱 Left for savings</span><b class="${left < 0 ? 'bad-t' : 'good-t'}">${money(Math.max(0, left))}</b>` : '';
}
async function exportCsv() {
  const all = (await store.allExpenses()).slice().sort((a, b) => a.date.localeCompare(b.date));
  const rows = [['Date', 'Category', 'Amount', 'Note'], ...all.map(e => [e.date, cat(e.catId).name, e.amount, e.note || ''])];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `monas-purse-expenses-${today()}.csv`; a.click();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'back') back(t.dataset.to);
  else if (a === 'prev' || a === 'next') setMonth(addMonths(state.month, a === 'prev' ? -1 : 1));
  else if (a === 'month') setMonth(t.dataset.m);
  else if (a === 'filter') { state.filter = t.dataset.cat || null; lastKey = ''; lastHtml = ''; render(); }
  else if (a === 'csv') exportCsv();
  else if (a === 'install' && window.__installEvt) { window.__installEvt.prompt(); window.__installEvt = null; lastKey = ''; lastHtml = ''; render(); }
  else if (a === 'signout') F.signOut(auth);
  else if (a === 'copyPrev') {
    const pm = addMonths(state.month, -1), prev = state.budgets[pm] || {}, pinc = state.income[pm] || 0;
    if (!Object.keys(prev).length && !pinc) return toast('No plan last month');
    document.querySelectorAll('#budgetForm input').forEach(i => i.value = (i.name === '__income' ? pinc : prev[i.name]) || '');
    updateAlloc(); toast('Copied. Tap Save to keep it');
  }
});
document.addEventListener('input', e => { if (e.target.form?.id === 'budgetForm') updateAlloc(); });
document.addEventListener('submit', e => {
  if (e.target.id !== 'budgetForm') return;
  e.preventDefault();
  const amounts = {}; let inc = 0;
  new FormData(e.target).forEach((v, k) => { const n = parseFloat(v); if (k === '__income') inc = n > 0 ? n : 0; else if (n > 0) amounts[k] = n; });
  run(store.saveBudget(state.month, amounts, inc));
  toast('Plan saved ✓'); lastKey = ''; lastHtml = ''; render();
});

/* ---------- auth & start ---------- */
let store = null;
const avatarStyle = () => state.user?.photoURL ? `background-image:url('${esc(state.user.photoURL)}')` : '';
const avatarText = () => state.user?.photoURL ? '' : esc([...(state.user?.displayName || 'M')][0]);
function start(s, user) {
  store = s; state.user = user;
  $('#auth').hidden = true; $('#app').hidden = false;
  store.start(); render();
}
function showAuth() {
  store?.stop(); store = null; lastKey = ''; Object.assign(state, { ready: false, user: null, expenses: [], budgets: {}, categories: [] });
  $('#view').innerHTML = '<div class="empty">Loading…</div>';
  $('#app').hidden = true; $('#auth').hidden = false;
}

if (LOCAL) {
  $('#signin').textContent = 'Try it on this device';
  $('#authNote').textContent = 'Demo mode: data stays on this device. Add your Firebase config to turn on Google login and sync.';
  $('#signin').onclick = () => start(localStore(), null);
  $('#auth').hidden = false;
} else {
  const provider = new F.GoogleAuthProvider();
  $('#signin').onclick = async () => {
    try { await F.signInWithPopup(auth, provider); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) F.signInWithRedirect(auth, provider);
      else if (e.code !== 'auth/popup-closed-by-user') toast(e.message);
    }
  };
  F.getRedirectResult(auth).catch(e => toast(e.message));
  F.onAuthStateChanged(auth, u => { if (u) { if (!store) start(cloudStore(u.uid), u); } else showAuth(); });
}
</script>
</body>
</html>
